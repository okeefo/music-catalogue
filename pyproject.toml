[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "music-catalogue"
version = "0.1.0"
description = "Desktop application for digitising and cataloguing vinyl records"
requires-python = ">=3.10"
dependencies = [
    "mutagen",
    "pytaglib",
    "pydub",
    "PyQt5",
    "qtpy",
    "pydantic",
    "numpy",
    "discogs_client",
    "winshell; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
    "send2trash",
]

[project.scripts]
music-catalogue = "main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 200

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/qt/resources_rcc.py"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled separately
